name: Deploy portfolio to GitHub Pages

# Publishes index.html to the gh-pages branch, which GitHub Pages serves.
# The gh-pages branch is deployment output only — never develop on it.

on:
  push:
    branches:
      - master
      - claude/portfolio-github-pages-barcode-qtpilv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          mkdir -p /tmp/site
          cp index.html /tmp/site/
          cp -r assets /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy portfolio from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
